server:
  port: 8090
spring:
  config:
    #加载配置
    import:
      - optional:file:.env[.properties]
      - optional:file:botter-rag/.env[.properties]
  application:
    name: botter-rag-kb
  datasource:
    url: jdbc:postgresql://localhost:5432/ragkb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  # SQL 初始化（建表 + 测试数据，IF NOT EXISTS + INSERT IGNORE 安全重复执行）
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true
  cache:
    redis:
      time-to-live: 6000
      cache-null-values: false


  #redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 2
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  #异步任务
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
      thread-name-prefix: "task-index-"
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB


    # ========== Spring AI ==========
  ai:
    openai:
      # 使用 DashScope 的 OpenAI 兼容接口
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.1      # RAG 场景用低温，减少幻觉
          max-tokens: 2048
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${DASHSCOPE_API_KEY}
        options:
          model: text-embedding-v3

# ========== MinIO ==========
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: rag-documents

# ========== Reranker ==========
reranker:
  endpoint: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
  api-key: ${DASHSCOPE_API_KEY}
  model: gte-rerank-v2
  timeout-ms: 800
  top-n: 5

# ========== RAG 参数 ==========
rag:
  chunk:
    size: 512
    overlap: 64
  retrieval:
    vector-top-k: 20
    fulltext-top-k: 20
    return-top-n: 5
    min-score: 0.5
  context:
    max-tokens: 3000
  cache:
    embedding-ttl: 7d
    query-ttl: 10m

# ========== Sa-Token ==========
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-concurrent: true
  is-share: false
  is-read-header: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.botter.ragkb: INFO
    org.springframework.ai: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
